services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trilha
      POSTGRES_PASSWORD: trilha
      POSTGRES_DB: trilha
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trilha"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgres://trilha:trilha@db:5432/trilha
      PORT: 3000
      # código para virar administrador da plataforma pelo app (defina antes de subir)
      ADMIN_CLAIM_CODE: ${ADMIN_CLAIM_CODE:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
