/* ---------- comemoração ---------- */
function checkGains(m){
  const s=stats(m); const key='trilha-dbv.seen.'+Store.mode+'.'+m.id;
  const seen=Store.demo?App.seen[key]:(App.seen[key]||LS.get(key));
  const cur={xp:s.xp,l:s.level,b:s.badges};
  if(!seen){ App.seen[key]=cur; if(!Store.demo) LS.set(key,cur); return; }
  const nb=s.badges.filter(b=>(seen.b||[]).indexOf(b)<0), gained=s.xp-(seen.xp||0), up=s.level>(seen.l||1);
  App.seen[key]=cur; if(!Store.demo) LS.set(key,cur);
  if(gained<=0&&!nb.length) return;
  if(up||nb.length){ App.overlay={level:up?s.level:null,title:s.title,badges:nb,gained:gained}; render(); burst(); }
  else toast('+'+gained+' XP! A liderança aprovou mais um requisito.','gold');
}
function overlayHtml(){
  const o=App.overlay; if(!o) return '';
  return '<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-t"><div class="modal">'+
   (o.level?lvlPatch({level:o.level}):'')+
   '<p class="eyebrow">'+(o.gained>0?'+'+o.gained+' XP':'Conquista')+'</p><h2 id="ov-t">'+(o.level?'Nível '+o.level+': '+esc(o.title)+'!':(o.badges.length>1?'Novas insígnias!':'Nova insígnia!'))+'</h2>'+
   (o.badges.length?'<div class="bstrip">'+o.badges.map(id=>patchHtml(BADGE[id],true,o.level?'sm':'lg')).join('')+'</div><p class="muted">'+o.badges.map(id=>esc(BADGE[id].name)).join(' · ')+'</p>':'')+
   '<button class="btn gold" data-act="closeOverlay">Continuar a trilha</button></div></div>';
}

function platResumo(P){
  const now=Date.now(), planOf=id=>P.plans.find(p=>p.id===id);
  const paying=P.clubs.filter(c=>c.subscription.active&&c.subscription.state!=='trial'&&c.subscription.planId);
  const mrr=paying.reduce((a,c)=>{ const p=planOf(c.subscription.planId); return a+(p?(p.interval==='anual'?p.priceCents/12:p.priceCents):0); },0);
  const got=P.invoices.filter(i=>i.status==='paga'&&i.paidAt&&now-Date.parse(i.paidAt)<30*864e5).reduce((a,i)=>a+i.amountCents,0);
  const trials=P.clubs.filter(c=>c.subscription.state==='trial'), expired=P.clubs.filter(c=>!c.subscription.active);
  const ending=trials.filter(c=>Date.parse(c.subscription.endsAt)-now<7*864e5).sort((a,b)=>Date.parse(a.subscription.endsAt)-Date.parse(b.subscription.endsAt));
  const pend=P.invoices.filter(i=>i.status==='pendente');

const gmShort=s=>s.length>72?s.slice(0,70).replace(/\s+\S*$/,'')+'…':s;
const gmEspItem=id=>{ const e=ESPI[id]; return e?{key:'esp:'+id,t:'Especialidade de '+e.n,esp:e}:null; };
function gmEspChallenges(e){
  const R=e.r, out=[], mine=new Set(R.map(normTxt)), bad=[];
  ESP.forEach(x=>{ if(x.id!==e.id) x.r.forEach(r=>{ if(!mine.has(normTxt(r))) bad.push(gmShort(r)); }); });
  if(R.length>=3) out.push({id:'ordem',mode:'ordem',title:'Os requisitos de '+e.n+', do primeiro ao último',items:R.map(gmShort),label:'Req.'});
  out.push({id:'caca',mode:'caca',title:'Requisitos de '+e.n,items:R.map(gmShort),bad:bad});
  const sents=R.filter(r=>gmWords(r).length);
  if(sents.length){ out.push({id:'forca',mode:'forca',title:'uma palavra dos requisitos',sents:sents});
    out.push({id:'quiz',mode:'quiz',title:'o texto dos requisitos',sents:sents}); }
  out.push({id:'area',mode:'quiz',kind:'area',modeName:'Qual é a área?',say:'Diga em qual área do caderno fica cada especialidade.',title:'as áreas do caderno'});
  return out;
}
/* os desafios de um requisito: conteúdo dele vira o jogo */
function gmChallenges(it){
  if(it.esp) return gmEspChallenges(it.esp);
  const out=[], nt=normTxt(it.t), P=gmPools();
  const add=(id,c)=>{ if(!out.some(x=>x.id===id)) out.push(Object.assign({id:id},c)); };
  const bank=id=>{ const b=GM_BANK[id]; add(id,{mode:b.mode==='frase'?'ordem':b.mode,title:b.t,items:b.mode==='frase'?(Array.isArray(b.items)?b.items:b.items.split(' ')):b.items,bad:b.bad,label:b.label,plain:b.plain||b.mode==='frase',full:b.mode==='frase'}); };
  if(/voto e a lei/.test(nt)){ bank('voto'); bank('lei'); }
  else if(/lei do desbravador/.test(nt)) bank('lei');
  else if(/voto do desbravador/.test(nt)) bank('voto');
  if(/alvo e o lema/.test(nt)){ bank('alvo'); bank('lema'); }
  if(/objetivo ja/.test(nt)) bank('objetivo');
  (it.a||[]).forEach(s=>{ const n=normTxt(s); GM_MATCH.forEach(m=>{ if(m[0].test(n)) bank(m[1]); }); });
  if(it.i){ let bs=planBooks(it); if(bs.length<4){ const s=Math.max(0,BIBLE.indexOf(bs[0]||'Gênesis')); bs=BIBLE.slice(s,s+8); } add('leitura',{mode:'ordem',title:'Livros do seu plano de leitura, na ordem da Bíblia',items:bs,plain:true}); }
  if(it.o&&it.o.length>=2){ const esp=it.o.filter(o=>ESP_BY_NAME[normTxt(o)]);
    if(esp.length>=2) add('opcoes',{mode:'caca',title:'Especialidades que valem para este requisito',items:esp,bad:P.esp.filter(n=>esp.indexOf(n)<0)});
    else add('opcoes',{mode:'memoria',title:'As opções deste requisito',items:it.o}); }
  if(it.a&&!out.length){ const vs=it.a.filter(isVerse);
    if(vs.length>=2) add('versos',{mode:'caca',title:'Os versos do seu cartão',items:vs,bad:P.verses.filter(v=>vs.indexOf(v)<0)});
    else add('itens',{mode:'memoria',title:'Os itens deste requisito',items:it.a}); }
  const words=gmWords(it.t), quiz=words.length>=2&&gmHash(it.key)%2===0;
  if(words.length) add('texto',{mode:quiz?'quiz':'forca',title:quiz?'o texto do requisito':'uma palavra do requisito',words:words});
  if(!out.length) add('texto',{mode:'forca',title:'Palavra secreta',words:['Desbravador']});
  return out;
}

    else { G.err++; G.lock=true; this.bad(); this.hud(); setTimeout(()=>{ if(this.G!==G||G.phase!=='play') return; G.up=[]; G.lock=false; this.board(); },G.age<=11?1000:700); } },
  tapKey(b){ const G=this.G, L=b.dataset.v; if(G.guess[L]) return; G.guess[L]=true; const W=normTxt(G.word).toUpperCase();
    if(W.indexOf(L)>=0){ G.score+=50*(W.split(L).length-1); this.good(); this.board(); this.hud(); if(W.split('').every(ch=>!/[A-Z]/.test(ch)||G.guess[ch])) this.end(true); }
    else { this.board(); this.miss(); } },
  tapOpt(b){ const G=this.G; if(G.lock) return; const ok=b.dataset.ok==='1';
    if(ok){ G.score+=150; this.good(); b.classList.add('right'); }
    else { b.classList.add('wrong'); const r=this.root.querySelector('[data-g="opt"][data-ok="1"]'); if(r) r.classList.add('right'); if(this.miss(b)) return; }
    G.lock=true; setTimeout(()=>{ if(this.G!==G||G.phase!=='play') return; G.lock=false; G.q++; if(G.q>=G.rounds.length) this.end(true); else { this.board(); this.hud(); } },ok?450:1100); },
  /* ---------- fim ---------- */
  end(win){
    const G=this.G; if(!G||G.phase!=='play') return; this.stop(); const th=this.th(), c=this.ch();
    if(win) G.score+=Math.max(0,G.lives)*50+(th.time?Math.round(Math.max(0,G.left))*5:0);
    let stars=0;
    if(win){ if(c.mode==='memoria') stars=G.err<=Math.floor(G.pairs/2)?3:G.err<=G.pairs?2:1; else stars=G.err===0?3:G.err<=Math.max(1,Math.floor(th.lives/2))?2:1; }
    let record=false;
    if(G.self){ const all=LS.get(GKEY(G.t))||{}, cur=all[G.it.key]||{s:0,p:0,n:0}; record=win&&(stars>cur.s||G.score>cur.p)&&cur.n>0;
      all[G.it.key]={s:Math.max(cur.s,stars),p:Math.max(cur.p,win?G.score:0),n:cur.n+1}; LS.set(GKEY(G.t),all); }
    G.result={win:win,stars:stars,score:G.score,err:G.err,record:record,answer:!win&&c.mode==='forca'?G.word:null};
    G.phase='end'; this.draw();
    if(win){ const w=th.wave; [523,659,784,1047].forEach((f,i)=>setTimeout(()=>gmBeep(f,.15,w),i*110)); burst(); }
    else gmBeep(110,.5,'sawtooth');
  }
};
